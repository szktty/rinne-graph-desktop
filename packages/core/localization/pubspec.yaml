name: core_localization
resolution: workspace
description: "Localization support for App application"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.7.0
  flutter: ">=3.41.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  core_foundation_flutter:
    path: ../foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.8.0 # Added flutter_gen_runner
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true
