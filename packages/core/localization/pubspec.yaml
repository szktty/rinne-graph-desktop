name: core_localization
resolution: workspace
description: "Localization support for App application"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.7.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  core_foundation_flutter:
    path: ../foundation
  core_settings:
    path: ../settings

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.8.0 # Added flutter_gen_runner
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true
