name: core_themes
resolution: workspace
description: Theme customization system for App app
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.7.0
  flutter: ">=3.41.2"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  core_foundation_flutter:
    path: ../../core/foundation_flutter
  core_settings:
    path: ../../core/settings

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
