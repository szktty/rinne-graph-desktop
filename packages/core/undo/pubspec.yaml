name: core_undo
resolution: workspace
description: Undo/redo system for App graph operations
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Core packages
  core_graph_flutter:
    path: ../graph_flutter_flutter
  core_foundation_flutter:
    path: ../foundation

  # Utilities
  equatable: ^2.0.5
  meta: ^1.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.2
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: false
